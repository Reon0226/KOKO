<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KOKO — きみの字で、話そう。</title><link rel="icon" href="icon.svg"><style>
:root{font-family:system-ui,sans-serif;color:#244650;background:#e5f4f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #d4e9ee;background:white;color:#244650;border-radius:14px;padding:10px 13px;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #438da0}button:disabled{opacity:.4;cursor:default}.app{max-width:520px;margin:auto;height:100dvh;background:#f2fbfe;display:flex;flex-direction:column;overflow:hidden}header{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d4e9ee;background:#fff}header img{width:52px;height:52px}h1{font-size:23px;margin:0;letter-spacing:3px}small{font-size:11px}header button{margin-left:auto;font-size:12px}.notice{font-size:11px;text-align:center;padding:8px;color:#57737e}.chat{flex:1;overflow:auto;padding:14px;min-height:65px}.empty{padding:20px 15px;text-align:center;color:#57737e;line-height:1.9}.message{max-width:90%;width:fit-content;background:#fff;border-radius:18px 18px 18px 4px;padding:8px;margin:12px 0;box-shadow:0 3px 14px #24465008}.message.mine{margin-left:auto;background:#d2f2fa;border-radius:18px 18px 4px 18px}.meta{font-size:10px;margin:4px 6px;color:#57737e}.inkflow{display:flex;flex-wrap:wrap;align-content:start;gap:0;min-height:36px}.inkflow svg,.space{width:32px;height:38px;flex:none}.break{flex-basis:100%;height:0}.composer{padding:12px 14px max(12px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d4e9ee}.draft{min-height:44px;max-height:92px;overflow:auto;border-radius:12px;background:#f2fbfe;padding:5px;margin-bottom:10px}.tools,.guidebar,.nav{display:flex;gap:6px;align-items:center}.tools{flex-wrap:wrap;margin-top:9px}.tools button{flex:1;font-size:12px;padding:8px}.primary{background:#87d9ed;border-color:#87d9ed;font-weight:700}.guides{display:flex;gap:6px;overflow:auto;flex:1}.guides button{white-space:nowrap;padding:5px 10px;font-size:14px}.caption{font-size:11px;color:#57737e;margin:5px 0}.search{width:100%;border:1px solid #d4e9ee;border-radius:10px;padding:7px 10px;margin:6px 0;font-size:13px}.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.cell{position:relative;aspect-ratio:1;border:1px solid #c3dce4;border-radius:12px;background:#fafefe;overflow:hidden}.cell.active{border:2px solid #61bed6;background:#f2fbfe}.cell:before,.cell:after{content:'';position:absolute;pointer-events:none}.cell:before{left:50%;top:0;bottom:0;border-left:1px dashed #d5e7ed}.cell:after{top:50%;left:0;right:0;border-top:1px dashed #d5e7ed}.target{position:absolute;inset:0;display:grid;place-items:center;color:#d8e7eb;font-size:clamp(48px,17vw,84px);pointer-events:none;user-select:none}.cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}.nav{justify-content:space-between}.nav button{font-size:12px}.status{font-size:11px;min-height:16px;margin:7px 0 0;color:#57737e}footer{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-top:5px}footer button{font-size:10px;min-height:28px;padding:3px 7px}
</style><div class="app"><header><img src="icon.svg" alt="水色のハートにKOKO"><div><h1>KOKO</h1><small>きみの字で、話そう。</small></div><button id="role">わたし ⇄ 相手</button></header><div class="notice">端末内の試作 · 通信／手書き認識は未接続</div><main class="chat" id="chat" aria-label="会話"></main><section class="composer" aria-label="手書き入力"><div id="draft" class="draft inkflow" aria-label="下書き"></div><div class="guidebar"><div class="guides" id="guides"></div><button id="toggle" aria-pressed="true" title="マスのお手本の表示切替">見本 ON</button></div><input id="search" class="search" placeholder="見本を探す（例：きもち、ありがとう）" aria-label="固定のお手本を読みで検索"><div class="caption">候補は書くための見本。押しても本文には入りません。</div><div class="cells" id="cells"></div><div class="nav"><button id="prev">← 前の字</button><span id="position" class="caption"></span><button id="next">次の字 →</button></div><div class="tools"><button id="undo">一画戻す</button><button id="del">⌫ 削除</button><button id="space">空白</button><button id="newline">改行</button><button class="primary" id="send">送る ↑</button></div><div id="status" class="status" role="status" aria-live="polite"></div><footer><span id="person"></span><button id="clear">履歴を消す</button></footer></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', KEY='koko-prototype-v1';
let state={role:0,messages:[],drafts:[[],[]]},cursor=0,showGuide=true,guide='ありがとう',guideStart=0,drawing=null,storageOK=true;
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.messages)&&Array.isArray(raw.drafts)&&raw.drafts.length===2&&raw.drafts.every(Array.isArray)&&[0,1].includes(raw.role))state=raw}catch(e){storageOK=false}
const candidates=[['ありがとう','ありがとう'],['きもち','気持ち'],['おつかれ','お疲れさま'],['だいすき','大好き'],['あした','明日'],['またね','またね'],['うれしい','嬉しい']];
const blank=()=>({kind:'ink',strokes:[]});const draft=()=>state.drafts[state.role];
function say(t){$('status').textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;say('保存できません。この画面を閉じると内容が失われる場合があります。')}}
function svg(token){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 100 100');s.setAttribute('aria-label','手書きの文字');for(const stroke of token.strokes){if(!stroke.length)continue;const p=document.createElementNS(NS,'path');const v=stroke.map((pt,i)=>(i?'L':'M')+(pt.x*100).toFixed(2)+','+(pt.y*100).toFixed(2));if(stroke.length===1)v.push('l.01,.01');p.setAttribute('d',v.join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','#244650');p.setAttribute('stroke-width','2.5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');s.append(p)}return s}
function flow(el,tokens){el.replaceChildren();for(const t of tokens){if(t.kind==='ink')el.append(svg(t));else{const x=document.createElement('span');x.className=t.kind==='newline'?'break':'space';el.append(x)}}}
function renderChat(){const el=$('chat');el.replaceChildren();if(!state.messages.length){const e=document.createElement('div');e.className='empty';e.textContent='いつものひと言も、きみの字なら。\n下のマスに書いてみよう。';el.append(e)}for(const m of state.messages){const wrap=document.createElement('article');wrap.className='message'+(m.role===state.role?' mine':'');const ink=document.createElement('div');ink.className='inkflow';flow(ink,m.tokens);const meta=document.createElement('div');meta.className='meta';meta.textContent=(m.role===0?'わたし':'相手')+' · 端末内 '+new Date(m.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});wrap.append(ink,meta);el.append(wrap)}el.scrollTop=el.scrollHeight}
function renderCandidates(){const q=$('search').value.trim();$('guides').replaceChildren();const found=candidates.filter(([r,w])=>!q||r.includes(q)||w.includes(q));for(const [,w] of found){const b=document.createElement('button');b.textContent=w;b.onclick=()=>{guide=w;guideStart=cursor;renderCells();say('「'+w+'」を見ながら、自分の字で書いてね。本文には追加していません。')};$('guides').append(b)}if(!found.length){const x=document.createElement('span');x.className='caption';x.textContent='この試作の固定例にはありません';$('guides').append(x)}}
function redraw(c,t){const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#244650';ctx.fillStyle='#244650';ctx.lineWidth=w*.025;ctx.lineCap='round';ctx.lineJoin='round';for(const a of t?.strokes||[]){if(!a.length)continue;ctx.beginPath();ctx.moveTo(a[0].x*w,a[0].y*h);if(a.length===1){ctx.arc(a[0].x*w,a[0].y*h,w*.0125,0,Math.PI*2);ctx.fill()}else{for(const p of a.slice(1))ctx.lineTo(p.x*w,p.y*h);ctx.stroke()}}}
function renderCells(){if(drawing)return;const root=$('cells');root.replaceChildren();const start=Math.floor(cursor/3)*3;for(let i=start;i<start+3;i++){const cell=document.createElement('div');cell.className='cell'+(i===cursor?' active':'');const target=document.createElement('span');target.className='target';target.textContent=showGuide?(Array.from(guide)[i-guideStart]||''):'';const c=document.createElement('canvas');c.width=360;c.height=360;c.setAttribute('aria-label',(i+1)+'文字目を書くマス');const token=draft()[i];if(token&&token.kind!=='ink'){target.textContent=token.kind==='space'?'␣':'↵'}redraw(c,token);c.onpointerdown=e=>{if(e.button!==0||drawing)return;if(draft()[i]&&draft()[i].kind!=='ink'){cursor=i;renderCells();say('ここは空白または改行です。削除してから書けます。');return}e.preventDefault();cursor=i;while(draft().length<=i)draft().push(blank());const point=pointAt(c,e);const stroke=[point];draft()[i].strokes.push(stroke);drawing={id:e.pointerId,c,stroke,token:draft()[i]};c.setPointerCapture(e.pointerId);for(const ch of root.children)ch.classList.remove('active');cell.classList.add('active');redraw(c,draft()[i])};c.onpointermove=e=>{if(!drawing||drawing.id!==e.pointerId)return;e.preventDefault();drawing.stroke.push(pointAt(c,e));redraw(c,drawing.token)};const finish=e=>{if(!drawing||drawing.id!==e.pointerId)return;drawing=null;save();renderDraft();renderCells()};c.onpointerup=finish;c.onpointercancel=finish;c.onlostpointercapture=finish;cell.append(target,c);root.append(cell)}$('position').textContent=(cursor+1)+'文字目';$('prev').disabled=cursor===0;$('next').disabled=cursor>=draft().length}
function pointAt(c,e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
function renderDraft(){flow($('draft'),draft());$('send').disabled=!draft().some(t=>t.kind==='ink'&&t.strokes.length);$('undo').disabled=!(draft()[cursor]?.strokes?.length)}
function refresh(){renderChat();renderDraft();renderCells();$('person').textContent=(state.role===0?'わたし':'相手')+' として操作中';$('role').textContent=(state.role===0?'相手に切替':'わたしに切替')}
$('prev').onclick=()=>{if(drawing)return;cursor=Math.max(0,cursor-1);renderCells();renderDraft()};$('next').onclick=()=>{if(drawing||cursor>=draft().length)return;cursor++;renderCells();renderDraft()};
$('undo').onclick=()=>{if(drawing)return;draft()[cursor]?.strokes?.pop();save();renderDraft();renderCells()};
$('del').onclick=()=>{if(drawing)return;const i=cursor<draft().length?cursor:cursor-1;if(i<0)return;draft().splice(i,1);cursor=Math.min(i,draft().length);save();renderDraft();renderCells()};
function insert(kind){if(drawing)return;const t=draft()[cursor];const at=t&&((t.kind==='ink'&&t.strokes.length)||t.kind!=='ink')?cursor+1:cursor;if(t?.kind==='ink'&&!t.strokes.length)draft().splice(cursor,1);draft().splice(at,0,{kind});cursor=at+1;save();renderDraft();renderCells()}
$('space').onclick=()=>insert('space');$('newline').onclick=()=>insert('newline');$('toggle').onclick=()=>{if(drawing)return;showGuide=!showGuide;$('toggle').textContent='見本 '+(showGuide?'ON':'OFF');$('toggle').setAttribute('aria-pressed',String(showGuide));renderCells()};$('search').oninput=renderCandidates;
$('send').onclick=()=>{if(drawing)return;const tokens=draft().filter(t=>t.kind!=='ink'||t.strokes.length);if(!tokens.some(t=>t.kind==='ink'&&t.strokes.length))return;state.messages.push({role:state.role,at:Date.now(),tokens:JSON.parse(JSON.stringify(tokens))});state.drafts[state.role]=[];cursor=0;guideStart=0;save();refresh();if(storageOK)say('端末内に送りました。相手に切り替えて、届く見え方を確認できます。')};
$('role').onclick=()=>{if(drawing)return;state.role=1-state.role;cursor=draft().length;guideStart=cursor;save();refresh();if(storageOK)say('同じ端末内で表示を切り替えました。実際の通信ではありません。')};
$('clear').onclick=()=>{if(drawing||!confirm('この端末の会話と下書きをすべて消しますか？'))return;state={role:0,messages:[],drafts:[[],[]]};cursor=0;guideStart=0;save();refresh();if(storageOK)say('履歴と下書きを消しました。')};renderCandidates();refresh();if(!storageOK)say('保存が使えないか、保存データを読み込めませんでした。');
</script></html>
